upstream api_backend {
    # Shared memory so every nginx worker process balances off the same
    # round-robin counter and the same max_fails/fail_timeout state, instead
    # of each worker keeping its own — without this, a multi-worker nginx
    # (worker_processes auto) looks unbalanced under light traffic because
    # each worker's independently-reset counter tends to pick the same
    # first peer.
    zone api_backend 64k;

    server api1:5201 max_fails=3 fail_timeout=10s;
    server api2:5201 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Demo aid: shows which container actually served the request, e.g.
        # `curl -sI http://localhost:5201/health | grep X-Upstream`.
        add_header X-Upstream-Server $upstream_addr always;
    }
}
